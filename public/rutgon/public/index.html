<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minh Wuan Short Link</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <section class="card hero">
      <p class="badge">SHORT LINK TOOL</p>
      <h1>Rút gọn link nhanh</h1>
      <p class="desc">Dán link dài vào đây, web sẽ tạo link ngắn để chia sẻ dễ hơn.</p>

      <form id="shortenForm" class="form">
        <label>Link cần rút gọn</label>
        <input id="url" type="url" placeholder="https://example.com/duong-dan-rat-dai" required />

        <label>Mã tuỳ chỉnh <span>(không bắt buộc)</span></label>
        <input id="customCode" type="text" placeholder="vd: kyha2026" maxlength="30" />

        <button type="submit">Tạo link ngắn</button>
      </form>

      <div id="result" class="result hidden">
        <p>Link ngắn của bạn:</p>
        <div class="result-row">
          <input id="shortUrl" readonly />
          <button id="copyBtn" type="button">Copy</button>
        </div>
      </div>

      <p id="message" class="message"></p>
    </section>

    <section class="card">
      <div class="list-head">
        <h2>Link đã tạo</h2>
        <button id="refreshBtn" type="button">Tải lại</button>
      </div>
      <div id="linksList" class="links-list"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
